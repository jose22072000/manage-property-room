services:
  app:
    build:
      context: .
      args:
        # Dokploy: Environment → Build Args → API_BASE_URL=https://api.tuapp.com
        API_BASE_URL: ${API_BASE_URL:-https://api.example.com}
    container_name: pmr-app-prod
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
