name: manage_property_room_app
description: "Property room management — Flutter multi-platform (Android, iOS, Web, Linux)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.0.0

  # Local persistence
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # File system paths
  path_provider: ^2.1.4
  path: ^1.9.0

  # Utilities
  uuid: ^4.4.0
  intl: ^0.20.0
  collection: ^1.18.0

  # Backend HTTP client (FASE 7-LINK)
  http: ^1.6.0

  # URL launcher (open links in browser / download APK)
  url_launcher: ^6.3.0

  # Image picker (web file + mobile camera/gallery)
  image_picker: ^1.1.2

  # System notifications (sound + vibration in background)
  flutter_local_notifications: ^18.0.1

  # Background task scheduler (Android background polling)
  workmanager: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

