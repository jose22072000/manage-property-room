services:
  api:
    build: .
    container_name: pmr-api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ENV: "dev"
      DB_DRIVER: "sqlite"
      DB_DSN: "/data/app.db"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-me}"
      JWT_TTL: "${JWT_TTL:-720h}"
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
    volumes:
      - ./data:/data
    restart: unless-stopped
