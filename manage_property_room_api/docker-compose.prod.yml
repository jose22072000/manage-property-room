services:
  api:
    build: .
    container_name: pmr-api-prod
    ports:
      - "8080:8080"
    env_file:
      - .env.prod
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
